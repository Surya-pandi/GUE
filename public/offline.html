<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#17243a" />
    <title>You're offline | Global University Expo</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f7f9fc;
        color: #17243a;
        font:
          16px/1.7 Arial,
          sans-serif;
      }
      main {
        max-width: 440px;
      }
      small {
        color: #2457c5;
        font-weight: 700;
        letter-spacing: 2px;
      }
      h1 {
        font-size: clamp(36px, 8vw, 52px);
        line-height: 1.1;
        letter-spacing: -2px;
      }
      p {
        color: #526176;
      }
      button {
        border: 0;
        border-radius: 999px;
        padding: 14px 24px;
        color: white;
        background: #2457c5;
        font: inherit;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid #2457c5;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <small>GLOBAL UNIVERSITY EXPO</small>
      <h1>Your next chapter can wait a moment.</h1>
      <p>
        You're offline. Connect to the internet to explore universities, access your
        account, and manage bookings.
      </p>
      <button type="button" onclick="window.location.reload()">
        Try again
      </button>
    </main>
  </body>
</html>
